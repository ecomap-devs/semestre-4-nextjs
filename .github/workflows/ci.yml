name: CI

# Roda em todo push e em todo PR para a main. É o portão que impede main quebrada.
# Não usa secret nenhum: o Firebase e o Supabase são inicializados só no navegador,
# então o build estático compila sem credenciais.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# O token da CI só lê o repositório (revisão de 01/10/2026: sem isto valia o
# padrão do GitHub, que pode dar escrita). Actions fixadas por SHA: uma tag pode
# ser movida para outro commit; um SHA, não.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Build (exportação estática)
        run: npm run build

      - name: Conferir que cada rota virou HTML
        run: |
          for f in index mapa animais 404; do
            test -f "out/$f.html" || { echo "::error::out/$f.html não foi gerado"; exit 1; }
          done
