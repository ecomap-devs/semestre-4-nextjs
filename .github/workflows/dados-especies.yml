name: Dados das espécies

# Todo dia 1º baixa a lista nacional de fauna ameaçada (MMA) e a categoria da IUCN de
# cada espécie do catálogo (GBIF), por scripts/especies/gerar.mjs, e, se algo mudou,
# sobe uma branch com o src/dados/especies.ts novo e abre uma issue com o link do PR. Mesmo esquema do dados-prodes.yml: o dado
# passa pela revisão, e o site no ar não depende do MMA nem do GBIF estarem no ar.
# Também dá para rodar na mão (Actions → Dados das espécies → Run workflow).
#
# Por que issue e não PR: PR aberto pelo GITHUB_TOKEN não dispara a CI nem o preview
# (regra do GitHub), e a `main` exige o check "Lint, tipos e build" da CI, então o PR
# ficaria preso. Por isso este job roda lint, tipos e build antes, e quem abre o PR é
# alguém do grupo, pelo link da issue (.github/scripts/abrir-issue-de-dados.sh).
on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

# Escrita só aqui: criar a branch e a issue. Nenhum secret é usado: as duas
# fontes são abertas e o build compila sem credenciais.
permissions:
  contents: write
  issues: write

concurrency:
  group: dados-especies
  cancel-in-progress: false

jobs:
  atualizar:
    name: Baixar os status e abrir a issue
    runs-on: ubuntu-latest
    steps:
      # Sem credencial gravada no .git/config: o `npm ci` e o build abaixo rodam código
      # de dependências, e o token de escrita só aparece no último passo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Gerar src/dados/especies.ts
        run: node scripts/especies/gerar.mjs

      - name: Ver se mudou
        id: mudou
        run: |
          if git diff --quiet -- src/dados/especies.ts; then
            echo "Nenhum status mudou."
            echo "sim=false" >> "$GITHUB_OUTPUT"
          else
            # O GBIF não data a categoria; a data do PR é a do dia em que o job viu a mudança.
            data=$(date -u +%F)
            echo "sim=true" >> "$GITHUB_OUTPUT"
            echo "branch=dados/especies-$data" >> "$GITHUB_OUTPUT"
            echo "data=$data" >> "$GITHUB_OUTPUT"
          fi

      - name: Conferir lint, tipos e build
        if: steps.mudou.outputs.sim == 'true'
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

      - name: Subir a branch e abrir a issue
        if: steps.mudou.outputs.sim == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.mudou.outputs.branch }}
          TITULO: Atualizar o status das espécies (${{ steps.mudou.outputs.data }})
          TEXTO_DO_PR: >-
            A lista nacional do MMA ou a categoria da IUCN de alguma espécie do catálogo mudou.
            Gerado por `scripts/especies/gerar.mjs` no workflow **Dados das espécies**, que já
            rodou lint, tipos e build. Confira no diff o que mudou e se a descrição da espécie
            ainda bate com o status novo antes do merge. No app, copie o arquivo para
            `lib/data/especies_data.dart` do semestre-4-flutter.
        run: bash .github/scripts/abrir-issue-de-dados.sh src/dados/especies.ts
