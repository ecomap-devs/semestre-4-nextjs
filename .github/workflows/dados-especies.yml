name: Dados das espécies

# Todo dia 1º baixa a lista nacional de fauna ameaçada (MMA) e a categoria da IUCN de
# cada espécie do catálogo (GBIF), por scripts/especies/gerar.mjs, e, se algo mudou,
# abre um PR com o src/dados/especies.ts novo. Mesmo esquema do dados-prodes.yml: o dado
# passa pela revisão, e o site no ar não depende do MMA nem do GBIF estarem no ar.
# Também dá para rodar na mão (Actions → Dados das espécies → Run workflow).
#
# PR aberto pelo GITHUB_TOKEN não dispara outros workflows (regra do GitHub), então a
# CI não roda sozinha nele. Por isso este job roda lint, tipos e build antes de abrir
# o PR. Para o PR ser aberto, o repositório precisa permitir: Settings → Actions →
# General → "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

# Escrita só aqui, e só para criar a branch e o PR. Nenhum secret é usado: as duas
# fontes são abertas e o build compila sem credenciais.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dados-especies
  cancel-in-progress: false

jobs:
  atualizar:
    name: Baixar os status e abrir PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Gerar src/dados/especies.ts
        run: node scripts/especies/gerar.mjs

      - name: Ver se mudou
        id: mudou
        run: |
          if git diff --quiet -- src/dados/especies.ts; then
            echo "Nenhum status mudou."
            echo "sim=false" >> "$GITHUB_OUTPUT"
          else
            # O GBIF não data a categoria; a data do PR é a do dia em que o job viu a mudança.
            data=$(date -u +%F)
            echo "sim=true" >> "$GITHUB_OUTPUT"
            echo "branch=dados/especies-$data" >> "$GITHUB_OUTPUT"
            echo "data=$data" >> "$GITHUB_OUTPUT"
          fi

      - name: Conferir lint, tipos e build
        if: steps.mudou.outputs.sim == 'true'
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

      - name: Abrir o PR
        if: steps.mudou.outputs.sim == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.mudou.outputs.branch }}
          DATA: ${{ steps.mudou.outputs.data }}
        run: |
          # Já existe PR desta data: nada a fazer.
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "A branch $BRANCH já existe."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add src/dados/especies.ts
          git commit -m "Atualizar o status das espécies ($DATA)"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Atualizar o status das espécies ($DATA)" \
            --body "A lista nacional do MMA ou a categoria da IUCN de alguma espécie do catálogo mudou. Gerado por \`scripts/especies/gerar.mjs\` no workflow **Dados das espécies**, que já rodou lint, tipos e build. Confira no diff o que mudou e se a descrição da espécie ainda bate com o status novo antes do merge."
