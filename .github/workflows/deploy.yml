name: Deploy para produção

# ⚠️ Só roda na mão (Actions → Deploy para produção → Run workflow), e de propósito.
#
# O endereço ecomapbrasil-17756.web.app ainda serve o build web do semestre-4-flutter.
# Publicar daqui SUBSTITUI aquele site. No dia da troca (README, seção "A troca de
# endereço"): rodar este workflow uma vez, conferir o site, e só então trocar o gatilho
# abaixo por `push: branches: [main]` e tirar o deploy web do repositório do Flutter.
on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite "substituir o site" para confirmar que este deploy troca o site no ar'
        required: true

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    name: Build e deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Conferir a confirmação
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          if [ "$CONFIRMACAO" != "substituir o site" ]; then
            echo "::error::Confirmação diferente de \"substituir o site\". Nada foi publicado."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint e tipos
        run: npm run lint && npm run typecheck

      - name: Build com as credenciais
        env:
          FIREBASE_API_KEY_WEB: ${{ secrets.FIREBASE_API_KEY_WEB }}
          FIREBASE_APP_ID_WEB: ${{ secrets.FIREBASE_APP_ID_WEB }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: bash .github/scripts/build-com-credenciais.sh

      - name: Deploy no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ECOMAPBRASIL_17756 }}
          projectId: ecomapbrasil-17756
          channelId: live
