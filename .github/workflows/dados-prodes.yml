name: Dados do PRODES

# Todo dia 1º baixa o PRODES do TerraBrasilis (scripts/prodes/gerar.mjs) e, se algo
# mudou, sobe uma branch com o src/dados/prodes.ts novo e abre uma issue com o link do
# PR. O dado nunca vai direto para a main: passa pela revisão como qualquer código, e o
# site no ar não depende do INPE estar no ar. Também dá para rodar na mão (Actions →
# Dados do PRODES → Run workflow).
#
# Por que issue e não PR: PR aberto pelo GITHUB_TOKEN não dispara a CI nem o preview
# (regra do GitHub), e a `main` exige o check "Lint, tipos e build" da CI, então o PR
# ficaria preso. Por isso o job `gerar` roda lint, tipos e build antes, e quem abre o PR é
# alguém do grupo, pelo link da issue (.github/scripts/abrir-issue-de-dados.sh).
on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

# Dois jobs de propósito. `gerar` roda código de dependências (npm) e só lê o repositório.
# `publicar` tem o token de escrita, parte de um checkout limpo e não roda nada delas: num
# job só, uma dependência poderia reescrever na árvore de trabalho o script que roda com o
# token. O que passa de um para o outro é só o arquivo de dado, que ainda vai pela revisão
# do PR. Nenhum secret é usado: o PRODES é aberto e o build compila sem credenciais.
permissions: {}

concurrency:
  group: dados-prodes
  cancel-in-progress: false

jobs:
  gerar:
    name: Baixar o PRODES e conferir
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sim: ${{ steps.mudou.outputs.sim }}
      branch: ${{ steps.mudou.outputs.branch }}
      data: ${{ steps.mudou.outputs.data }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Gerar src/dados/prodes.ts
        run: node scripts/prodes/gerar.mjs

      - name: Ver se mudou
        id: mudou
        run: |
          if git diff --quiet -- src/dados/prodes.ts; then
            echo "Nada novo no PRODES."
            echo "sim=false" >> "$GITHUB_OUTPUT"
          else
            data=$(grep -o 'prodesAtualizadoEm = "[0-9-]*"' src/dados/prodes.ts | grep -o '[0-9-]\{10\}')
            echo "sim=true" >> "$GITHUB_OUTPUT"
            echo "branch=dados/prodes-$data" >> "$GITHUB_OUTPUT"
            echo "data=$data" >> "$GITHUB_OUTPUT"
          fi

      - name: Conferir lint, tipos e build
        if: steps.mudou.outputs.sim == 'true'
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.mudou.outputs.sim == 'true'
        with:
          name: dados-prodes
          path: src/dados/prodes.ts
          if-no-files-found: error
          retention-days: 1

  publicar:
    name: Subir a branch e abrir a issue
    needs: gerar
    if: needs.gerar.outputs.sim == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dados-prodes
          path: src/dados

      - name: Subir a branch e abrir a issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.gerar.outputs.branch }}
          TITULO: Atualizar os dados do PRODES (${{ needs.gerar.outputs.data }})
          TEXTO_DO_PR: >-
            O TerraBrasilis publicou dados novos do PRODES em ${{ needs.gerar.outputs.data }}. Gerado por
            `scripts/prodes/gerar.mjs` no workflow **Dados do PRODES**, que já rodou lint, tipos
            e build. Confira no diff se os números mudaram o esperado antes do merge.
        run: bash .github/scripts/abrir-issue-de-dados.sh src/dados/prodes.ts
