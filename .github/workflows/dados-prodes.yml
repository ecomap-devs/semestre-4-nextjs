name: Dados do PRODES

# Todo dia 1º baixa o PRODES do TerraBrasilis (scripts/prodes/gerar.mjs) e, se algo
# mudou, sobe uma branch com o src/dados/prodes.ts novo e abre uma issue com o link do
# PR. O dado nunca vai direto para a main: passa pela revisão como qualquer código, e o
# site no ar não depende do INPE estar no ar. Também dá para rodar na mão (Actions →
# Dados do PRODES → Run workflow).
#
# Por que issue e não PR: PR aberto pelo GITHUB_TOKEN não dispara a CI nem o preview
# (regra do GitHub), e a `main` exige o check "Lint, tipos e build" da CI, então o PR
# ficaria preso. Por isso este job roda lint, tipos e build antes, e quem abre o PR é
# alguém do grupo, pelo link da issue (.github/scripts/abrir-issue-de-dados.sh).
on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

# Escrita só aqui: criar a branch e a issue. Nenhum secret é usado: o PRODES é
# aberto e o build compila sem credenciais.
permissions:
  contents: write
  issues: write

concurrency:
  group: dados-prodes
  cancel-in-progress: false

jobs:
  atualizar:
    name: Baixar o PRODES e abrir a issue
    runs-on: ubuntu-latest
    steps:
      # Sem credencial gravada no .git/config: o `npm ci` e o build abaixo rodam código
      # de dependências, e o token de escrita só aparece no último passo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Gerar src/dados/prodes.ts
        run: node scripts/prodes/gerar.mjs

      - name: Ver se mudou
        id: mudou
        run: |
          if git diff --quiet -- src/dados/prodes.ts; then
            echo "Nada novo no PRODES."
            echo "sim=false" >> "$GITHUB_OUTPUT"
          else
            data=$(grep -o 'prodesAtualizadoEm = "[0-9-]*"' src/dados/prodes.ts | grep -o '[0-9-]\{10\}')
            echo "sim=true" >> "$GITHUB_OUTPUT"
            echo "branch=dados/prodes-$data" >> "$GITHUB_OUTPUT"
            echo "data=$data" >> "$GITHUB_OUTPUT"
          fi

      - name: Conferir lint, tipos e build
        if: steps.mudou.outputs.sim == 'true'
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

      - name: Subir a branch e abrir a issue
        if: steps.mudou.outputs.sim == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.mudou.outputs.branch }}
          TITULO: Atualizar os dados do PRODES (${{ steps.mudou.outputs.data }})
          TEXTO_DO_PR: >-
            O TerraBrasilis publicou dados novos do PRODES em ${{ steps.mudou.outputs.data }}. Gerado por
            `scripts/prodes/gerar.mjs` no workflow **Dados do PRODES**, que já rodou lint, tipos
            e build. Confira no diff se os números mudaram o esperado antes do merge.
        run: bash .github/scripts/abrir-issue-de-dados.sh src/dados/prodes.ts
