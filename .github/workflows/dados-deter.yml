name: Dados do DETER

# Todo dia 1º baixa os alertas de desmatamento do DETER (INPE) dos últimos 12 meses,
# por scripts/deter/gerar.py, e, se algo mudou, sobe uma branch com o
# public/alertas-desmatamento.json e o public/alertas/ novos e abre uma issue com o
# link do PR. Mesmo esquema do dados-prodes.yml: o dado passa pela revisão, e o site
# no ar não depende do INPE estar no ar. Também dá para rodar na mão (Actions → Dados
# do DETER → Run workflow).
#
# Por que issue e não PR: PR aberto pelo GITHUB_TOKEN não dispara a CI nem o preview
# (regra do GitHub), e a `main` exige o check "Lint, tipos e build" da CI, então o PR
# ficaria preso. Abrir PR também exige ligar "Allow GitHub Actions to create and approve
# pull requests", que deixa um workflow aprovar PR. Até 01/11/2026 este workflow tentava
# abrir o PR e falhava por isso. Aberto por alguém do grupo pelo link da issue, o PR roda
# CI e preview como qualquer outro.
on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

# Escrita só aqui: criar a branch e a issue. Nenhum secret é usado: o DETER é aberto e o
# build compila sem credenciais.
permissions:
  contents: write
  issues: write

concurrency:
  group: dados-deter
  cancel-in-progress: false

jobs:
  atualizar:
    name: Baixar os alertas e abrir a issue
    runs-on: ubuntu-latest
    steps:
      # Sem credencial gravada no .git/config: o `npm ci` e o build abaixo rodam código
      # de dependências, e o token de escrita só aparece no último passo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/deter/requirements.txt

      - name: Instalar o GeoPandas
        run: pip install -r scripts/deter/requirements.txt

      - name: Gerar public/alertas-desmatamento.json e public/alertas/
        run: python scripts/deter/gerar.py

      - name: Ver se mudou
        id: mudou
        run: |
          if [ -z "$(git status --porcelain -- public/alertas-desmatamento.json public/alertas/)" ]; then
            echo "Nada novo no DETER."
            echo "sim=false" >> "$GITHUB_OUTPUT"
          else
            # A data do alerta mais recente, gravada pelo gerador no próprio arquivo.
            data=$(node -p 'require("./public/alertas-desmatamento.json").fim')
            echo "sim=true" >> "$GITHUB_OUTPUT"
            echo "branch=dados/deter-$data" >> "$GITHUB_OUTPUT"
            echo "data=$data" >> "$GITHUB_OUTPUT"
          fi

      - name: Conferir lint, tipos e build
        if: steps.mudou.outputs.sim == 'true'
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

      - name: Subir a branch e abrir a issue
        if: steps.mudou.outputs.sim == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.mudou.outputs.branch }}
          TITULO: Atualizar os alertas do DETER (${{ steps.mudou.outputs.data }})
          TEXTO_DO_PR: >-
            O INPE publicou alertas do DETER até ${{ steps.mudou.outputs.data }}. Gerado por
            `scripts/deter/gerar.py` no workflow **Dados do DETER**, que já rodou lint, tipos
            e build. O arquivo é grande: confira o total de alertas no log do job e o mapa no
            preview antes do merge.
        run: bash .github/scripts/abrir-issue-de-dados.sh public/alertas-desmatamento.json public/alertas/
