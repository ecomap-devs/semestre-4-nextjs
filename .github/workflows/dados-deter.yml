name: Dados do DETER

# Todo dia 1º baixa os alertas de desmatamento do DETER (INPE) dos últimos 12 meses,
# por scripts/deter/gerar.mjs, e, se algo mudou, abre um PR com o
# public/alertas-desmatamento.json novo. Mesmo esquema do dados-prodes.yml: o dado
# passa pela revisão, e o site no ar não depende do INPE estar no ar.
# Também dá para rodar na mão (Actions → Dados do DETER → Run workflow).
#
# PR aberto pelo GITHUB_TOKEN não dispara outros workflows (regra do GitHub), então a
# CI não roda sozinha nele. Por isso este job roda lint, tipos e build antes de abrir
# o PR. Para o PR ser aberto, o repositório precisa permitir: Settings → Actions →
# General → "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

# Escrita só aqui, e só para criar a branch e o PR. Nenhum secret é usado: o DETER
# é aberto e o build compila sem credenciais.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dados-deter
  cancel-in-progress: false

jobs:
  atualizar:
    name: Baixar os alertas e abrir PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Gerar public/alertas-desmatamento.json
        run: node scripts/deter/gerar.mjs

      - name: Ver se mudou
        id: mudou
        run: |
          if git diff --quiet -- public/alertas-desmatamento.json; then
            echo "Nada novo no DETER."
            echo "sim=false" >> "$GITHUB_OUTPUT"
          else
            # A data do alerta mais recente, gravada pelo gerador no próprio arquivo.
            data=$(node -p 'require("./public/alertas-desmatamento.json").fim')
            echo "sim=true" >> "$GITHUB_OUTPUT"
            echo "branch=dados/deter-$data" >> "$GITHUB_OUTPUT"
            echo "data=$data" >> "$GITHUB_OUTPUT"
          fi

      - name: Conferir lint, tipos e build
        if: steps.mudou.outputs.sim == 'true'
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

      - name: Abrir o PR
        if: steps.mudou.outputs.sim == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.mudou.outputs.branch }}
          DATA: ${{ steps.mudou.outputs.data }}
        run: |
          # Já existe PR desta data: nada a fazer.
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "A branch $BRANCH já existe."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add public/alertas-desmatamento.json
          git commit -m "Atualizar os alertas do DETER ($DATA)"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Atualizar os alertas do DETER ($DATA)" \
            --body "O INPE publicou alertas do DETER até $DATA. Gerado por \`scripts/deter/gerar.mjs\` no workflow **Dados do DETER**, que já rodou lint, tipos e build. O arquivo é grande: confira o total de alertas no log do job e o mapa no preview antes do merge."
